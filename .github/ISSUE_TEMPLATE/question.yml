name: "Question / help"
description: "Ask about installation, configuration or existing behavior."
title: "[Question]: "
labels:
  - "Type: Question"
  - "needs-triage"
body:
  -
    type: "checkboxes"
    id: "checks"
    attributes:
      label: "Before submitting"
      options:
        -
          label: "I searched existing issues and checked the project README."
          required: true
        -
          label: "I removed tokens, passwords, personal data and private server details from my report and attachments."
          required: true
  -
    type: "textarea"
    id: "question"
    attributes:
      label: "Your question"
      description: "Describe what you are trying to achieve and where you are stuck."
    validations:
      required: true
  -
    type: "textarea"
    id: "versions"
    attributes:
      label: "Versions and environment"
      description: "Modpack version, Minecraft, loader version and any added or removed mods. Specify T&K2 or T&K3."
    validations:
      required: true
  -
    type: "textarea"
    id: "attempts"
    attributes:
      label: "What have you tried?"
      description: "Link relevant documentation and include any error message."
    validations:
      required: true
