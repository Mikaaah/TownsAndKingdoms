name: "Player feedback"
description: "Share feedback about the existing modpack experience."
title: "[Feedback]: "
labels:
  - "Type: Feedback"
  - "needs-triage"
body:
  -
    type: "checkboxes"
    id: "checks"
    attributes:
      label: "Before submitting"
      options:
        -
          label: "I searched existing issues and checked the project README."
          required: true
        -
          label: "I removed tokens, passwords, personal data and private server details from my report and attachments."
          required: true
  -
    type: "dropdown"
    id: "area"
    attributes:
      label: "Affected area"
      options:
        - "Startup / crash"
        - "Performance"
        - "Recipes / automation"
        - "Quests / progression"
        - "Combat / magic"
        - "World generation"
        - "Multiplayer"
        - "Wiki / documentation"
        - "Other"
    validations:
      required: true
  -
    type: "textarea"
    id: "version"
    attributes:
      label: "Modpack version"
      description: "Specify T&K2 or T&K3 and the build."
    validations:
      required: true
  -
    type: "textarea"
    id: "feedback"
    attributes:
      label: "Your feedback"
      description: "What worked well, what felt frustrating, and what would improve the experience?"
    validations:
      required: true
