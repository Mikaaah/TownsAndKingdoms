name: Publish T&K3 player guide

on:
  push:
    branches: [main]
    paths:
      - 'TK3/player-guide/**'
      - '.github/workflows/publish-player-guide.yml'
      - '.github/workflows/publish-tk3-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tk3-player-guide-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload player guide
        uses: actions/upload-pages-artifact@v3
        with:
          path: TK3/player-guide
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
