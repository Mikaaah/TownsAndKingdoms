name: Publish T&K3 player guide

on:
  push:
    branches: [main]
    paths:
      - 'TK3/player-guide/**'
      - 'TK3/handbook-source/**'
      - 'TK3/docs/**'
      - 'TK3/tools/build_handbook.cjs'
      - 'TK3/tools/verify_handbook.py'
      - 'TK3/wiki-archive/**'
      - 'TK3/kubejs/assets/kubejs/textures/item/**'
      - '.github/workflows/publish-player-guide.yml'
      - '.github/workflows/publish-tk3-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tk3-player-guide-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install handbook dependencies
        working-directory: TK3/handbook-source
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and verify all pages
        run: |
          node TK3/tools/build_handbook.cjs
          python3 TK3/tools/verify_handbook.py
          npm run --prefix TK3/handbook-source test:models
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload player guide
        uses: actions/upload-pages-artifact@v3
        with:
          path: TK3/player-guide
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
