name: Towns & Kingdoms documentation

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/publish-portal.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/publish-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install documentation dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify preserved TK2 documentation
        run: node scripts/check-legacy.mjs
      - name: Build the documentation portal
        run: npm run build
      - name: Test registries, planner rules and Ponder assets
        run: npm test
      - name: Verify deployed TK2 files
        run: node scripts/check-legacy.mjs --dist
      - name: Verify legacy links and redirects
        run: node scripts/check-legacy-links.mjs --dist
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4

  sync-wiki:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish handbook links to the GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; fi; }; f'
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" github-wiki
          cp portal/wiki/Home.md portal/wiki/_Sidebar.md github-wiki/
          cd github-wiki
          git rm --ignore-unmatch -- _Footer.md
          git add -- Home.md _Sidebar.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Point the GitHub Wiki to the handbook"
          git push origin HEAD
