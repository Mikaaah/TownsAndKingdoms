name: Publish handbook wiki redirect

on:
  workflow_run:
    workflows: ["Publish T&K3 player guide"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tk3-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the published handbook
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Confirm the handbook is live
        run: |
          python3 - <<'PY'
          import json, urllib.request, os, time
          with open('TK3/wiki-archive/migration.json') as f:
              expected=json.load(f)
          for attempt in range(6):
              try:
                  url='https://mikaaah.github.io/TownsAndKingdoms/migration.json?revision='+os.environ['GITHUB_SHA']
                  with urllib.request.urlopen(url, timeout=15) as r:
                      live=json.load(r)
                  assert live==expected, 'Published Pages snapshot does not match this migration.'
                  break
              except Exception:
                  if attempt==5:
                      raise
                  time.sleep(5)
          assert live['authored_recipe_count']==662 and len(live['pages'])==11
          PY

      - name: Clone the original GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Verify every original page is archived
        run: python3 TK3/tools/verify_wiki_archive.py wiki

      - name: Replace wiki contents with the handbook portal
        run: |
          find wiki -maxdepth 1 -type f -name '*.md' -delete
          cp TK3/wiki/*.md wiki/

      - name: Publish the redirect
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki redirect is already current."
            exit 0
          fi
          git commit -m "docs: move the full wiki to Pages and publish the handbook portal"
          git push origin HEAD
