name: Publish T&K3 wiki pages

on:
  push:
    branches:
      - main
    paths:
      - "TK3/wiki/3.0-Modlist.md"
      - "TK3/wiki/3.0-Changelog.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tk3-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish 3.0 modlist and changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Clone GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Copy T&K3 wiki pages
        run: |
          cp "TK3/wiki/3.0-Modlist.md" "wiki/3.0-Modlist.md"
          cp "TK3/wiki/3.0-Changelog.md" "wiki/3.0-Changelog.md"

      - name: Publish changed pages
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "3.0-Modlist.md" "3.0-Changelog.md"

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync T&K3 3.0 wiki pages"
          git push origin HEAD
