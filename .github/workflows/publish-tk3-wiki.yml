name: Sync handbook wiki pages

on:
  workflow_run:
    workflows: ["Publish T&K3 player guide"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tk3-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the published wiki reference
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Confirm the matching reference is live
        run: |
          python3 - <<'CHECK'
          import json, time, urllib.request
          with open('TK3/player-guide/reference.json') as f:
              expected=json.load(f)
          for attempt in range(6):
              try:
                  url='https://mikaaah.github.io/TownsAndKingdoms/reference.json?v='+expected['build_fingerprint']
                  with urllib.request.urlopen(url,timeout=15) as r:
                      live=json.load(r)
                  assert live==expected, 'Published reference does not match this source revision.'
                  break
              except Exception:
                  if attempt==5: raise
                  time.sleep(5)
          CHECK
      - name: Clone the original GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
      - name: Sync current guide entry points
        run: |
          cp TK3/wiki/*.md wiki/
      - name: Publish wiki pages
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi
          git commit -m "docs: sync current TNK3 guides and first development changelog"
          git push origin HEAD
