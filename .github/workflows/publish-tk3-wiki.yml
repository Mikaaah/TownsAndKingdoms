name: Sync handbook wiki pages

on:
  workflow_run:
    workflows: ["Publish T&K3 player guide"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tk3-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the published handbook
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Confirm the handbook is live
        run: |
          python3 - <<'PY'
          import json, urllib.request, os, time
          with open('TK3/wiki-archive/migration.json') as f:
              expected=json.load(f)
          for attempt in range(6):
              try:
                  url='https://mikaaah.github.io/TownsAndKingdoms/migration.json?revision='+os.environ['GITHUB_SHA']
                  with urllib.request.urlopen(url, timeout=15) as r:
                      live=json.load(r)
                  assert live['wiki_head']==expected['wiki_head'], 'Published handbook points to a different source wiki snapshot.'
                  assert live['archived_at']==expected['archived_at'], 'Published handbook archive date does not match.'
                  assert live['pages']==expected['pages'], 'Published archived-page hashes or destinations do not match.'
                  expected_history=expected.get('portal_history', [])
                  assert live.get('portal_history', [])[:len(expected_history)]==expected_history, 'Published handbook lost prior portal history.'
                  break
              except Exception:
                  if attempt==5:
                      raise
                  time.sleep(5)
          with open('TK3/docs/wiki_production_manifest.json') as f:
              recipes=json.load(f)['recipes']
          authored_count=len(recipes)
          assert live['authored_recipe_count']==authored_count
          assert live['workshop_recipe_count']==authored_count+1
          assert live['quest_count']==expected['quest_count'] and len(live['pages'])==11
          PY

      - name: Clone the original GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Sync curated pages and preserve the rest of the wiki
        run: |
          cp TK3/wiki/Home.md TK3/wiki/_Sidebar.md TK3/wiki/Skilltree-v4.6.md wiki/

      - name: Publish the redirect
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki redirect is already current."
            exit 0
          fi
          git commit -m "docs: sync curated handbook pages to the wiki"
          git push origin HEAD
