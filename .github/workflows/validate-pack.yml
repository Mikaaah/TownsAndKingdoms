name: Validate pack sources
on:
  push:
    branches: ["tnk3-development"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: python3 scripts/validate_json.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          if [ -d kubejs ]; then
            find kubejs -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi
