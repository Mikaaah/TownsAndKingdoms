name: Build T&K Loot & Identification alpha
on:
  push:
    branches:
      - build/tnkloot-0.1.0-alpha
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Extract alpha sources
        run: tar -xJf tnk-build-only.tar.xz
      - name: Compile NeoForge mod
        run: gradle build --stacktrace --no-daemon
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tnkloot-0.1.0-alpha-jar
          path: build/libs/*.jar
